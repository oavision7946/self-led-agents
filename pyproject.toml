[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "self-led-agents"
version = "0.2.0"
description = "Self-led agents: a simulation of character as an engineering property in multi-agent systems, built on the IFS-MAS architecture"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Omar Orqueda" }]
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=7", "matplotlib>=3.7"]

[tool.setuptools]
packages = ["ifs_mas"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
